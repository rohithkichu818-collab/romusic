services:
  - type: web
    name: romusic
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed_data.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true

