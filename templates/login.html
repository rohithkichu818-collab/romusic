{% extends 'base.html' %}

{% block title %}Sign In — ROMUSIC{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="glass-panel-elevated p-8 sm:p-10 rounded-3xl border border-[#9B5CFF]/30 shadow-2xl relative overflow-hidden">
        <!-- Glow accents -->
        <div class="absolute -top-16 -right-16 w-40 h-40 rounded-full bg-[#9B5CFF]/30 blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-40 h-40 rounded-full bg-[#35D6FF]/20 blur-2xl pointer-events-none"></div>

        <div class="relative z-10 text-center mb-8">
            <img src="{{ url_for('static', filename='images/romusic_logo.svg') }}" class="w-16 h-16 mx-auto mb-3 drop-shadow-[0_0_20px_#9B5CFF]">
            <h1 class="text-3xl font-black font-display text-white">Sign In</h1>
            <p class="text-xs text-gray-400 mt-1">Immerse into the Midnight Luxe acoustic ecosystem.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-5 relative z-10">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">Username or Email</label>
                <input type="text" name="identifier" value="rohit" required placeholder="Enter moniker or email" class="w-full bg-[#181C33] text-sm text-white px-4 py-3.5 rounded-xl border border-white/10 focus:border-[#35D6FF] focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">Password</label>
                <input type="password" name="password" value="password123" required placeholder="••••••••" class="w-full bg-[#181C33] text-sm text-white px-4 py-3.5 rounded-xl border border-white/10 focus:border-[#35D6FF] focus:outline-none">
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#9B5CFF] to-[#35D6FF] text-[#090B16] font-extrabold text-sm hover:scale-[1.01] transition-transform shadow-xl shadow-[#35D6FF]/30">
                Enter Sanctuary
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-white/5 text-center text-xs text-gray-400">
            Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-[#35D6FF] hover:underline font-semibold ml-1">Create Account</a>
        </div>

        <!-- Quick Demo Hint -->
        <div class="mt-4 p-3 rounded-xl bg-white/5 border border-white/5 text-[11px] font-mono text-gray-400 text-center">
            Demo Admin: <span class="text-white font-bold">rohit</span> | Pass: <span class="text-white font-bold">password123</span>
        </div>
    </div>
</div>
{% endblock %}
