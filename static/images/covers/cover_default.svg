<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
        
        <defs>
            <radialGradient id="aurora" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#9B5CFF" stop-opacity="0.9"/>
                <stop offset="50%" stop-color="#35D6FF" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#090B16" stop-opacity="1"/>
            </radialGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="30" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>
        <rect width="600" height="600" fill="#090B16"/>
        <circle cx="300" cy="220" r="180" fill="url(#aurora)" filter="url(#glow)"/>
        <path d="M50 450 Q 200 320, 350 420 T 550 380" stroke="#9B5CFF" stroke-width="6" fill="none" opacity="0.8"/>
        <path d="M50 480 Q 220 360, 380 460 T 550 410" stroke="#35D6FF" stroke-width="4" fill="none" opacity="0.6"/>
        
        <!-- Glass Badge overlay -->
        <rect x="50" y="470" width="500" height="85" rx="18" fill="rgba(17, 20, 38, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
        <text x="80" y="512" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">ROMUSIC</text>
        <text x="80" y="538" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#35D6FF" letter-spacing="2" text-transform="uppercase">Next-Gen Sound Architecture</text>
        <circle cx="510" cy="512" r="18" fill="#9B5CFF" opacity="0.9"/>
        <polygon points="506,504 518,512 506,520" fill="#090B16"/>
    </svg>