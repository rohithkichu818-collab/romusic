name: Build Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build ROMUSIC APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/*.apk build-output/ROMUSIC.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROMUSIC-APK
          path: build-output/ROMUSIC.apk
          retention-days: 30

      - name: Create GitHub Release (on tag or main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: ROMUSIC Mobile Release v1.0.${{ github.run_number }}
          body: |
            ## 🎵 ROMUSIC Mobile APK Release
            - **Auto-built from commit:** ${{ github.sha }}
            - **Platform:** Android 7.0+ (API 24+)
            - **Features:** Lossless streaming, Background playback, Neon Aurora Luxe UI

            ### 📲 How to install:
            1. Download `ROMUSIC.apk` below.
            2. Open the file on your Android phone.
            3. Tap **Install** (Allow install from unknown sources if prompted).
            4. Enjoy ad-free lossless music streaming!
          files: build-output/ROMUSIC.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
